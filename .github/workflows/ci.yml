name: Test and build
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: python -m mypy
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and smoke-test wheel
        run: |
          python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',glob.glob('dist/*.whl')[0]])"
          python scripts/check_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
